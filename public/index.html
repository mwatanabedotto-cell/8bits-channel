<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>8bits Channel · Visor IPTV</title>
  <meta name="description" content="Visor de canales IPTV públicos de iptv-org, ordenados por país y categoría, solo con canales verificados." />
  <meta name="theme-color" content="#0b0420" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=VT323&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>" />
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="sun"></div><div class="floor"></div></div>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Filtros">☰</button>
    <h1 class="brand"><span class="brand-8">8BITS</span><span class="brand-ch">CHANNEL</span></h1>
    <input id="search" type="search" placeholder="🔍 buscar canal_" autocomplete="off" readonly />
    <span id="stats" class="stats"></span>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <section>
        <h2>Agrupar por</h2>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="group" value="country" checked /> País</label>
          <label><input type="radio" name="group" value="category" /> Enfoque</label>
        </div>
      </section>
      <section>
        <label class="toggle fav-toggle">
          <input id="favOnly" type="checkbox" />
          ★ Solo mis favoritos (<span id="favCount">0</span>)
        </label>
      </section>
      <section>
        <label class="toggle">
          <input id="browserOnly" type="checkbox" checked />
          Solo canales reproducibles en el navegador
        </label>
        <p class="hint">Los demás funcionan en VLC/Kodi con la <a href="data/playlist.m3u" download>lista M3U</a>.</p>
      </section>
      <section>
        <h2>Enfoque <button id="clearCats" class="link">limpiar</button></h2>
        <div id="categories" class="chips"></div>
      </section>
      <section class="grow">
        <h2>País <button id="clearCountry" class="link">limpiar</button></h2>
        <input id="countrySearch" type="search" placeholder="🔍 filtrar países…" autocomplete="off" readonly />
        <ul id="countries" class="countries"></ul>
      </section>
      <section>
        <p class="hint" id="brokenInfo"></p>
        <button id="resetBroken" class="link">Restaurar canales eliminados en este navegador</button>
      </section>
    </aside>

    <main>
      <section id="player" class="player" hidden>
        <div class="video-wrap">
          <video id="video" controls controlslist="nofullscreen" disablepictureinpicture playsinline autoplay></video>
          <div id="playerMsg" class="player-msg" hidden></div>
          <span class="onair">● EN VIVO</span>
          <div id="osd" class="osd" hidden aria-live="polite">
            <div class="osd-num"></div>
            <div class="osd-body"><div class="osd-name"></div><div class="osd-meta"></div></div>
          </div>
          <button id="soundBtn" class="sound-btn" hidden>🔇 ACTIVAR SONIDO</button>
          <button id="exitFull" class="exit-full" hidden>✕ SALIR DE PANTALLA COMPLETA</button>
          <div id="fullHint" class="full-hint" hidden></div>
        </div>
        <div class="player-info">
          <img id="playerLogo" alt="" />
          <div>
            <h2 id="playerName"></h2>
            <p id="playerMeta"></p>
          </div>
          <select id="streamSelect" aria-label="Fuente"></select>
          <div class="zapbar">
            <button id="favBtn" class="icon-btn fav-btn" aria-label="Favorito" title="Añadir a favoritos (*)">☆</button>
            <button id="fullBtn" class="icon-btn" aria-label="Pantalla completa" title="Pantalla completa (F)">⛶</button>
          </div>
          <button id="closePlayer" class="icon-btn" aria-label="Cerrar">✕</button>
        </div>
      </section>
      <section id="rows" class="rows">
        <div class="row-block" id="recentBlock" hidden>
          <h2 class="row-title">⟲ Últimos vistos</h2>
          <div class="row" id="recentRow"></div>
        </div>
        <div class="row-block" id="favBlock" hidden>
          <h2 class="row-title">★ Favoritos</h2>
          <div class="row" id="favRow"></div>
        </div>
      </section>
      <div id="list"></div>
      <div id="sentinel"></div>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/hls.min.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
