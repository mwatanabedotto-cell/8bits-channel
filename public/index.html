<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>8bits Channel · Visor IPTV</title>
  <meta name="description" content="Visor de canales IPTV públicos de iptv-org, ordenados por país y categoría, solo con canales verificados." />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>" />
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Filtros">☰</button>
    <h1>📺 8bits Channel</h1>
    <input id="search" type="search" placeholder="Buscar canal…" autocomplete="off" />
    <span id="stats" class="stats"></span>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <section>
        <h2>Agrupar por</h2>
        <div class="seg" role="radiogroup">
          <label><input type="radio" name="group" value="country" checked /> País</label>
          <label><input type="radio" name="group" value="category" /> Enfoque</label>
        </div>
      </section>
      <section>
        <label class="toggle">
          <input id="browserOnly" type="checkbox" checked />
          Solo canales reproducibles en el navegador
        </label>
        <p class="hint">Los demás funcionan en VLC/Kodi con la <a href="data/playlist.m3u" download>lista M3U</a>.</p>
      </section>
      <section>
        <h2>Enfoque <button id="clearCats" class="link">limpiar</button></h2>
        <div id="categories" class="chips"></div>
      </section>
      <section class="grow">
        <h2>País <button id="clearCountry" class="link">limpiar</button></h2>
        <input id="countrySearch" type="search" placeholder="Filtrar países…" />
        <ul id="countries" class="countries"></ul>
      </section>
      <section>
        <p class="hint" id="brokenInfo"></p>
        <button id="resetBroken" class="link">Restaurar canales eliminados en este navegador</button>
      </section>
    </aside>

    <main>
      <section id="player" class="player" hidden>
        <div class="video-wrap">
          <video id="video" controls playsinline autoplay></video>
          <div id="playerMsg" class="player-msg" hidden></div>
        </div>
        <div class="player-info">
          <img id="playerLogo" alt="" />
          <div>
            <h2 id="playerName"></h2>
            <p id="playerMeta"></p>
          </div>
          <select id="streamSelect" aria-label="Fuente"></select>
          <button id="closePlayer" class="icon-btn" aria-label="Cerrar">✕</button>
        </div>
      </section>
      <div id="list"></div>
      <div id="sentinel"></div>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/hls.min.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
